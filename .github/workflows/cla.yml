# SPDX-License-Identifier: FSL-1.1-ALv2
#
# CLA Assistant Lite: asks external contributors to sign CLA.md by posting a
# PR comment, and records signatures in the `cla-signatures` branch (never on
# main) so the signature file's history stays separate from product history.
name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    # The owner and bots never sign: the action's own allowlist matches commit
    # author names, not logins, so it still blocked the owner's PRs. The check
    # sits on the job, not the step, so their PRs skip it without taking a
    # runner at all.
    if: >
      ((github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
      github.event_name == 'pull_request_target') &&
      github.event.pull_request.user.login != 'mathieufro' &&
      github.event.issue.user.login != 'mathieufro' &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/liaison-sh/liaison/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: mathieufro,dependabot[bot],bot*
