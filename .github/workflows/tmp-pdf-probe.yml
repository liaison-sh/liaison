name: tmp-pdf-probe
on:
  push:
    branches: [fix/release-unit-tests]
    paths: [".github/workflows/tmp-pdf-probe.yml"]
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.x"
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client redis-tools libxml2-utils strace
      - run: |
          cp .env.test.example .env.test
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|; s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 32)|" .env.test
      - run: bun run infra:up
      - run: bun run scripts/bootstrap-test-env.ts
      - name: The CPU limit test, sampled
        run: |
          ( for i in $(seq 1 60); do sleep 1; for p in $(pgrep -f 'pdf-form-worker'); do echo "t=$i pid=$p $(ps -o stat=,time=,rss=,wchan:20= -p $p) $(awk '{print "ut="$14" st="$15}' /proc/$p/stat) $(grep -E 'VmData|VmRSS' /proc/$p/status | tr -s ' \t' ' ' | tr '\n' ' ') $(tr '\0' ' ' </proc/$p/limits 2>/dev/null | grep -E 'cpu time' | tr -s ' ')"; done; done ) > /tmp/samples.log 2>&1 &
          S=$!
          ( sleep 2; while ! p=$(pgrep -f 'pdf-form-worker' | head -1); do sleep 0.2; done; timeout 45 sudo strace -f -c -p "$p" -o /tmp/strace.txt ) &
          bun run scripts/test-run.ts unit --file src/modules/documents/pdf-form.test.ts --test "the kernel's CPU limit kills" 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -vE '^\{"level"' | tail -25 | cut -c1-200
          sleep 3; kill $S 2>/dev/null || true; head -40 /tmp/samples.log | cut -c1-170; head -24 /tmp/strace.txt || true
