name: tmp-unit-probe
on:
  push:
    branches: [fix/release-unit-tests]
    paths: [".github/workflows/tmp-unit-probe.yml"]
permissions:
  contents: read
jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        cfg: [plain, junit, pool, shardenv, nodeenv, pipeonly]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_MEM_RESERVE_MB: "2048"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.x"
      - run: bun install --frozen-lockfile
      - run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17 redis-tools libxml2-utils
          pg_dump --version
      - name: Write .env.test
        run: |
          set -euo pipefail
          cp .env.test.example .env.test
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|; s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 32)|" .env.test
      - run: bun run infra:up
      - run: bun run scripts/bootstrap-test-env.ts
      - name: Files
        env:
          CFG: ${{ matrix.cfg }}
        run: |
          mkdir -p logs/m
          cat > /tmp/one.sh <<'EOS'
          #!/bin/bash
          # inside with-test-lock: namespace env is set
          cd apps/api
          f="$1"; n=$(echo "$f" | tr '/' '_')
          args=(--env-file=../../.env.test --timeout 60000)
          case "$CFG" in
            junit) args+=(--reporter=junit --reporter-outfile=/tmp/x.xml) ;;
            pool) export DB_POOL_MAX=8 DB_ACQUIRE_TIMEOUT_MS=10000 ;;
            shardenv) export WORKER_ID=0 REDIS_PREFIX="${LIAISON_TEST_NS:-liaison}:s0_7:" MEILI_INDEX_PREFIX="${LIAISON_TEST_NS:-liaison}-s0_" ;;
            nodeenv) unset NODE_ENV ;;
          esac
          s=$(date +%s)
          if [ "$CFG" = pipeonly ]; then
            timeout -k 5 170 bun test "${args[@]}" "./$f" > >(cat > "../../logs/m/$n.out") 2> >(cat > "../../logs/m/$n.err"); rc=$?
          else
            timeout -k 5 170 bun test "${args[@]}" "./$f" > "../../logs/m/$n.out" 2>&1; rc=$?
          fi
          echo "$CFG rc=$rc $(( $(date +%s) - s ))s $f NODE_ENV=${NODE_ENV:-unset} DB=$(echo "${DATABASE_URL:-}" | sed 's#.*/##')"
          EOS
          chmod +x /tmp/one.sh
          for f in src/cli/cli-smoke.test.ts src/modules/export/org-archive/writer.test.ts src/infra/events/agent-turn-audit-identity.integration.test.ts; do
            bun run scripts/with-test-lock.ts -- /tmp/one.sh "$f" 2>&1 | grep -E "^$CFG rc=|rror" | head -5
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m-${{ matrix.cfg }}
          path: logs/m/
