# SPDX-License-Identifier: FSL-1.1-ALv2
#
# Build (and push) the Liaison image for one architecture. release.yml and
# nightly.yml share it. It is a composite action, not a reusable workflow:
# release.yml also runs under `act` in the operator drill, and a local reusable
# workflow call is the part `act` may fail to resolve, while a local composite
# step runs there like any other (operator-drills.yml proves it on every change
# to this file). The caller checks the repository out first and holds
# `packages: write` when it pushes.
#
# The merge, signing and publish steps are NOT here on purpose: the job that
# holds id-token checks out nothing, so it cannot run a local action.
name: Build the Liaison image
description: Writes the release manifest, then builds one architecture, and pushes it when asked.

inputs:
  version:
    description: The version the image reports (LIAISON_VERSION and the release manifest).
    required: true
  platform:
    description: The one platform to build, such as linux/amd64.
    required: true
  tags:
    description: The intermediate per-architecture tag. Not part of the published tags.
    required: true
  context:
    description: The checkout to build, relative to the workspace.
    default: "."
  push:
    description: Log in to GHCR and push.
    default: "true"
  load:
    description: Load the result into the local Docker instead (the operator dry run).
    default: "false"

outputs:
  digest:
    description: The digest of the pushed image.
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.4.x"
    - name: Write release manifest
      shell: bash
      working-directory: ${{ inputs.context }}
      # No `bun install` first: the script only imports node:crypto/fs/path, so
      # it needs nothing from node_modules. Each build regenerates it from its
      # own checkout: it is a pure function of the tree, and upload-artifact's
      # backend is not emulated by `act`, so it cannot be handed down.
      env:
        GIT_TAG: ${{ inputs.version }}
      run: bun run scripts/build-release-manifest.ts
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      if: inputs.push == 'true'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Build
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/apps/api/Dockerfile
        platforms: ${{ inputs.platform }}
        push: ${{ inputs.push }}
        load: ${{ inputs.load }}
        tags: ${{ inputs.tags }}
        build-args: LIAISON_VERSION=${{ inputs.version }}
        labels: |
          org.opencontainers.image.source=https://github.com/mathieufro/liaison
          org.opencontainers.image.licenses=FSL-1.1-ALv2
          org.opencontainers.image.description=Liaison self-hosted agent-native business OS
