name: tmp-unit-probe
on:
  push:
    branches: [fix/release-unit-tests]
    paths: [".github/workflows/tmp-unit-probe.yml"]
permissions:
  contents: read
jobs:
  wedge:
    strategy:
      fail-fast: false
      matrix:
        list: ["tmp-probe-cli.txt"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_MEM_RESERVE_MB: "2048"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.x"
      - run: bun install --frozen-lockfile
      - run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17 redis-tools libxml2-utils
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Write .env.test
        env:
          CFG: debuglog
        run: |
          set -euo pipefail
          cp .env.test.example .env.test
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|; s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 32)|" .env.test
      - run: bun run infra:up
      - run: bun run scripts/bootstrap-test-env.ts
      - name: Runner on writer and friends
        run: |
          mkdir -p logs/w # recheck in-thread
          LOG_DIR=$PWD/logs/w TEST_UNIT_SHARDS=4 TEST_UNIT_SILENCE_MS=200000 timeout -k 10 1100 bun run scripts/with-test-lock.ts -- bun run scripts/test-unit-parallel.ts --retries=0 -- $(cat .github/${{ matrix.list }}) 2>&1 | tee logs/w/run.log; echo "rc=${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: w-${{ matrix.list }}
          path: logs/w/
