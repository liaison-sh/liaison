# SPDX-License-Identifier: FSL-1.1-ALv2
#
# Phase 14 operator-tier drills (E2E plan O1 and O5). Triggered only when infra
# files change to keep the Docker-heavy work out of the per-PR happy path.
# Each job leaves no orphaned containers because every script wraps its work
# in a finally / down -v.
name: operator-drills

on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/docker-compose.yml"
      - "deploy/.env.example"
      - "apps/api/Dockerfile"
      - ".github/workflows/release.yml"
      - ".github/actions/build-image/**"
      - "scripts/validate-compose.ts"
      - ".github/workflows/operator-drills.yml"
      - "deploy/sandbox-firewall.sh"
      - "apps/api/scripts/entrypoint.sh"
      - "packages/sandbox-supervisor/**"

permissions:
  contents: read

jobs:
  # O1 — pinned compose boots, /healthz reports the released tag.
  validate-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.x"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Generate throwaway deploy env
        # deploy/.env is gitignored (operator-supplied secrets); CI needs one to
        # exist to drive docker compose, so seed it from the committed example
        # with generated, CI-only values for every variable compose requires
        # (`${VAR:?...}` in deploy/docker-compose.yml) — never real secrets.
        run: |
          set -euo pipefail
          cp deploy/.env.example deploy/.env
          set_var() {
            sed -i "s|^$1=.*|$1=$2|" deploy/.env
          }
          set_var JWT_SECRET "$(openssl rand -hex 32)"
          set_var ENCRYPTION_KEY "$(openssl rand -hex 32)"
          set_var BYOK_ENCRYPTION_KEY "$(openssl rand -hex 32)"
          set_var MEILISEARCH_MASTER_KEY "$(openssl rand -hex 32)"
          set_var MONITOR_TOKEN "$(openssl rand -hex 32)"
          set_var POSTGRES_PASSWORD "$(openssl rand -hex 16)"
          set_var LIAISON_APP_PASSWORD "$(openssl rand -hex 16)"
          set_var LIAISON_READONLY_PASSWORD "$(openssl rand -hex 16)"
          set_var OBJECT_STORE_ADMIN_ACCESS_KEY "ci-objectstore-admin"
          set_var OBJECT_STORE_ADMIN_SECRET_KEY "$(openssl rand -hex 16)"
          set_var OBJECT_STORAGE_ACCESS_KEY "$(openssl rand -hex 16)"
          set_var OBJECT_STORAGE_SECRET_KEY "$(openssl rand -hex 16)"
      - name: Pull or build the release image
        # v0.1.0 has not been published to GHCR yet (no release has been cut).
        # Once it has, this pulls it like a real operator would; until then it
        # builds the same tag locally from the Dockerfile so the drill still
        # validates the compose file end to end.
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/liaison-sh/liaison:v0.1.0"
          if docker pull "$IMAGE"; then
            echo "pulled $IMAGE"
          else
            echo "$IMAGE not published yet; building locally from apps/api/Dockerfile"
            # Pass the same build-arg release.yml does, so the local build
            # reports version v0.1.0 at /healthz like the real release image
            # would — without it, the image reports the Dockerfile's "dev"
            # default and validate-compose's version check fails regardless
            # of whether the stack itself is healthy.
            docker build -t "$IMAGE" --build-arg LIAISON_VERSION=v0.1.0 -f apps/api/Dockerfile .
          fi
      - name: Compose drill
        run: bun run validate-compose --tag v0.1.0

  # The app sandbox service under gVisor: the image built from this commit,
  # the `sandbox` profile up with the stack, the host firewall step installed,
  # then the probes from inside the sandbox (only the app's bridge port
  # answers) and the app healthy with the service configured.
  sandbox-gvisor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.x"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Generate throwaway deploy env
        # deploy/.env is gitignored (operator-supplied secrets); CI needs one to
        # exist to drive docker compose, so seed it from the committed example
        # with generated, CI-only values for every variable compose requires
        # (`${VAR:?...}` in deploy/docker-compose.yml) — never real secrets.
        run: |
          set -euo pipefail
          cp deploy/.env.example deploy/.env
          set_var() {
            sed -i "s|^$1=.*|$1=$2|" deploy/.env
          }
          set_var JWT_SECRET "$(openssl rand -hex 32)"
          set_var ENCRYPTION_KEY "$(openssl rand -hex 32)"
          set_var BYOK_ENCRYPTION_KEY "$(openssl rand -hex 32)"
          set_var MEILISEARCH_MASTER_KEY "$(openssl rand -hex 32)"
          set_var MONITOR_TOKEN "$(openssl rand -hex 32)"
          set_var POSTGRES_PASSWORD "$(openssl rand -hex 16)"
          set_var LIAISON_APP_PASSWORD "$(openssl rand -hex 16)"
          set_var LIAISON_READONLY_PASSWORD "$(openssl rand -hex 16)"
          set_var OBJECT_STORE_ADMIN_ACCESS_KEY "ci-objectstore-admin"
          set_var OBJECT_STORE_ADMIN_SECRET_KEY "$(openssl rand -hex 16)"
          set_var OBJECT_STORAGE_ACCESS_KEY "$(openssl rand -hex 16)"
          set_var OBJECT_STORAGE_SECRET_KEY "$(openssl rand -hex 16)"
      - name: Install gVisor (runsc)
        run: |
          set -euo pipefail
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update -q && sudo apt-get install -y -q runsc
          sudo runsc install
          sudo systemctl restart docker
          docker run --rm --runtime=runsc busybox:1.36 dmesg | head -3
      - name: Build the image from this commit
        run: docker build -t liaison-sandbox-drill:ci --build-arg LIAISON_VERSION=v0.1.0 -f apps/api/Dockerfile .
      - name: Stack with the sandbox service, firewall step, probes
        env:
          LIAISON_IMAGE: liaison-sandbox-drill:ci
          COMPOSE_PROFILES: sandbox
          LIAISON_SANDBOX_URL: http://sandbox:8790
        run: |
          set -euo pipefail
          cd deploy
          docker compose up -d --wait --wait-timeout 600 app sandbox
          sudo sh ./sandbox-firewall.sh apply
          docker compose exec -T sandbox bun --eval "fetch('http://localhost:8790/stats').then(r => r.json()).then(j => console.log(JSON.stringify(j.pool ?? j)))"
          # Docker's name service as gVisor sees it (diagnostic only).
          docker compose exec -T sandbox bun --eval "require('node:dns').promises.lookup('app-bridge').then(a => console.log('dns app-bridge:', JSON.stringify(a)), e => console.log('dns app-bridge:', e.code))"
          sh ./sandbox-firewall.sh check
          # The app is healthy with the service configured, and the bridge port
          # is not the API: its health page is 404 there.
          docker compose exec -T app bun --eval "fetch('http://localhost:3000/healthz').then(r => r.json()).then(b => { console.log(JSON.stringify(b.dependencies)); process.exit(Object.values(b.dependencies || {}).every(v => v === 'ok') ? 0 : 1) })"
      - name: Logs on failure
        if: failure()
        run: cd deploy && docker compose logs --no-color --tail 200 sandbox app || true
      - name: Tear down
        if: always()
        run: cd deploy && docker compose --profile sandbox down -v || true

  # O5 — release workflow dry run reaches the digest-sign step.
  release-workflow-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - name: Install act
        run: |
          set -euo pipefail
          # Pinned release + checksum, never an installer piped from a moving
          # branch. To bump: set ACT_VERSION and the sha256 of
          # act_Linux_x86_64.tar.gz from that release's checksums.txt.
          ACT_VERSION="v0.2.89"
          ACT_SHA256="0191d6f1f3b716b5c55820032605d05fc3c1cdbf581ebeff655019e5dd1524c0"
          curl -fsSL -o /tmp/act.tar.gz \
            "https://github.com/nektos/act/releases/download/${ACT_VERSION}/act_Linux_x86_64.tar.gz"
          echo "${ACT_SHA256}  /tmp/act.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/act.tar.gz -C /usr/local/bin act
          act --version
      - name: Dry-run release.yml
        env:
          LIAISON_RELEASE_DRY_RUN: "1"
        run: |
          act push \
            -W .github/workflows/release.yml \
            --eventpath .github/workflows/test-events/release-tag.json \
            --env LIAISON_RELEASE_DRY_RUN=1 \
            -P ubuntu-latest=catthehacker/ubuntu:act-latest \
            -P ubuntu-24.04-arm=catthehacker/ubuntu:act-latest
