name: tmp-release-proof
on:
  push:
    branches: [fix/release-guards]
    paths: [".github/workflows/tmp-release-proof.yml"]
permissions:
  contents: read
jobs:
  # The packager as merged, in the state the unit step leaves: the guard test fails.
  before:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: 58269362a5bd08d2f46a70574e08bcaac4a43dfd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.x"
      - run: bun install --frozen-lockfile
      - name: guard test with no app built
        run: bun test scripts/check-bundled-app-version.test.ts -t "the packager reports"
      - name: build the catalog, as scope-registry.test.ts does in the unit step
        run: bun run scripts/build-app-catalog.ts --out-dir "$RUNNER_TEMP/catalog" 2>&1 | tail -3; ls -la bundled-apps/invoicing/node_modules/@liaison
      - name: guard test after it
        run: |
          bun test scripts/check-bundled-app-version.test.ts -t "the packager reports" > "$RUNNER_TEMP/g.log" 2>&1 && rc=0 || rc=$?
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/g.log" | grep -E '^error:|Expected to contain| pass$| fail$'
          echo "GUARD_TEST_EXIT=$rc"
  # The fixed tree, guards and root right after the same catalog build.
  guards-root:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_MEM_RESERVE_MB: "2048"
      LIAISON_TEST_SLOTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.x"
      - run: bun install --frozen-lockfile
      - run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17 redis-tools libxml2-utils
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          cp .env.test.example .env.test
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|; s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 32)|" .env.test
      - run: bun run infra:up
      - run: bun run scripts/build-app-catalog.ts --out-dir "$RUNNER_TEMP/catalog" 2>&1 | tail -3; ls -la bundled-apps/invoicing/node_modules/@liaison
      - run: bun run test:guards
      - run: bun run test:root
  # The release job's steps as they stand, on the final tree.
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.x"
      - run: bun install --frozen-lockfile
      - name: Install postgres/redis CLIs
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17 redis-tools libxml2-utils
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Write .env.test
        run: |
          set -euo pipefail
          cp .env.test.example .env.test
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|; s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 32)|" .env.test
      - run: bun run infra:up
      - name: Unit tests (+ guards + root)
        env:
          TEST_MEM_RESERVE_MB: "2048"
          LIAISON_TEST_SLOTS: "1"
        run: bun run test:unit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-logs
          path: logs/
