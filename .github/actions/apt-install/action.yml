# SPDX-License-Identifier: FSL-1.1-ALv2
#
# Installs Ubuntu packages on a hosted runner. When the install fails because
# the runner's own DNS resolver cannot resolve the Ubuntu mirrors, it points
# the runner at public resolvers and tries once more instead of failing the job.
name: apt-install
description: Install Ubuntu packages, retrying through public DNS when the runner resolver fails
inputs:
  packages:
    description: Space-separated package names
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        apt_get() {
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o APT::Update::Error-Mode=any "$@"
        }
        install() {
          apt_get update && apt_get install -y --no-install-recommends $PACKAGES
        }
        if ! install; then
          echo "::warning::apt install failed; retrying with public DNS resolvers"
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\nDomains=~.\n' | sudo tee /etc/systemd/resolved.conf.d/public-dns.conf >/dev/null
          sudo systemctl restart systemd-resolved
          install
        fi
