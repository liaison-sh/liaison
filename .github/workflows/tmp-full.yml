name: tmp-full
on:
  push:
    branches: [fix/release-unit-tests]
    paths: [".github/workflows/tmp-full.yml"]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.x"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install postgres/redis CLIs
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17 redis-tools libxml2-utils
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Write .env.test
        run: |
          set -euo pipefail
          cp .env.test.example .env.test
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|; s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 32)|" .env.test
      - name: Bring up test infra (Postgres, Redis, MeiliSearch, SeaweedFS)
        run: bun run infra:up
      - name: Unit tests (+ guards + root)
        env:
          TEST_MEM_RESERVE_MB: "2048"
          LIAISON_TEST_SLOTS: "1"
        run: bun run test:unit
      - name: Keep the run's logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-logs
          path: logs/
      - name: Tear down test infra
        if: always()
        run: docker compose down -v
