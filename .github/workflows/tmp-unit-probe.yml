name: tmp-unit-probe
on:
  push:
    branches: [fix/release-unit-tests]
    paths: [".github/workflows/tmp-unit-probe.yml"]
permissions:
  contents: read
jobs:
  wedge:
    strategy:
      fail-fast: false
      matrix:
        cfg: [debuglog, warnlog]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_MEM_RESERVE_MB: "2048"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.x"
      - run: bun install --frozen-lockfile
      - run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17 redis-tools libxml2-utils
      - name: Write .env.test
        env:
          CFG: ${{ matrix.cfg }}
        run: |
          set -euo pipefail
          cp .env.example .env.test
          sed -i 's#^DATABASE_URL=.*#DATABASE_URL=postgres://liaison_app:liaison_app@localhost:5432/liaison_test#' .env.test
          sed -i 's#^NODE_ENV=.*#NODE_ENV=test#' .env.test
          echo "MEILISEARCH_API_KEY=dev-master-key" >> .env.test
          if [ "$CFG" = warnlog ]; then sed -i 's#^LOG_LEVEL=.*#LOG_LEVEL=warn#' .env.test; fi
      - run: bun run infra:up
      - run: bun run scripts/bootstrap-test-env.ts
      - name: Runner on writer and friends
        run: |
          mkdir -p logs/w
          ( sleep 75; for p in $(pgrep -f 'bun test --env-file'); do age=$(ps -o etimes= -p $p); [ "$age" -gt 45 ] || continue; echo "--- pid $p age $age: $(tr '\0' ' ' < /proc/$p/cmdline | sed 's/.*xml //')"; for t in /proc/$p/task/*; do echo "$(cat $t/comm) wchan=$(cat $t/wchan) syscall=$(sudo cut -d' ' -f1-3 $t/syscall)"; done; sudo ls -l /proc/$p/fd | awk '{print $9,$10,$11}' | grep -E 'pipe|socket|^[012] ' | head -12; done; docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}'; free -m | head -3; ss -s | head -3 ) > logs/w/threads.log 2>&1 &
          LOG_DIR=$PWD/logs/w TEST_UNIT_SHARDS=4 TEST_UNIT_SILENCE_MS=120000 timeout -k 10 500 bun run scripts/with-test-lock.ts -- bun run scripts/test-unit-parallel.ts --retries=0 -- $(cat .github/tmp-probe-tail.txt) 2>&1 | tee logs/w/run.log; echo "rc=${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: w-${{ matrix.cfg }}
          path: logs/w/
