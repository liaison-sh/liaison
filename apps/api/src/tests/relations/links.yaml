# SPDX-License-Identifier: FSL-1.1-ALv2
#
# Links between objects that this tree builds, against every event that can break them.
#
# Events: Rn rename, Mg merge (a person too), Dl delete or archive, Dx a person deactivated,
# Pm a permission lost, Ap an app switched off, Mv a move, Rs a restricted document, Dr a demo
# reset, Ex export and data subject request, Mi an old row from before the link existed, Rv the
# way back (reactivated, permission regained, away ended), Aw a person away.
#
# Classes (upper case): K keep, P repoint, S snapshot, C close, H hide, R refuse, E export,
# M migrate, Z reset, V return, W pass on (classes.ts says what each must see).
# Pruned (lower case): a the event cannot happen to this link, c the same code path as a named
# cell, e demo reset is one check after the demo reset test, b frozen by design.
#
# `columns`: the schema columns that hold the link, which the schema guard reads.
#
# A kept cell has a generated test (cells.integration.test.ts), or an `open` reason: what it waits
# for. `broken`: the cell's test shows the product does not do what the class says yet; the test
# runs as an expected failure and turns red once fixed, when the entry goes.

links:
  - name: approval-target
    what: a pending approval to the record it would change
    storedIn: kernel.approval_requests payload and targetRowParam
    columns: []
    paths:
      - apps/api/src/modules/approvals/
      - apps/api/src/apps/projects/service/tasks.ts
      - apps/api/src/apps/tickets/merge.ts
    visibleState: [cancelled, expired, failed]
    whoIsTold: [requester]
    copiedNameAt: []
    cells: { Rn: S, Mg: C, Dl: C, Dx: a, Pm: C, Ap: C, Mv: C, Rs: H, Dr: e, Ex: E, Mi: a, Rv: V, Aw: a }
    open:
      Pm: no reader of the target is defined that loses a permission while a decider keeps theirs
      Mv: the visible state of a pending row whose task moved project is not defined yet
      Rs: no approval targets a restricted document in this tree
      Ex: no data subject export exists for a person; the export takes a contact

  - name: approval-requester
    what: a pending approval to the person who asked for it
    storedIn: kernel.approval_requests.requested_by
    columns: [kernel.approval_requests.requested_by]
    paths:
      - apps/api/src/modules/approvals/
      - apps/api/src/modules/users/service.ts
      - apps/api/src/modules/users/merge-placeholder.ts
    visibleState: [cancelled, usual]
    whoIsTold: [usual]
    copiedNameAt: []
    cells: { Rn: c, Mg: P, Dl: C, Dx: C, Pm: C, Ap: c, Mv: a, Rs: a, Dr: e, Ex: E, Mi: a, Rv: V, Aw: W }
    open:
      Mg: only an import placeholder merges, and a placeholder cannot ask for anything
      Dx: what a request shows once the person who asked has left is not defined; today it stays pending as it was
      Pm: what a request shows once the person who asked lost the permission it needs is not defined
      Ex: no data subject export exists for a person; the export takes a contact
      Aw: what the person who asked hands on while away is not defined; the request is the deciders'

  - name: approval-route
    what: a pending approval to the person it is for
    storedIn: kernel.approval_requests.route_person_id, route_company_id
    columns: [kernel.approval_requests.route_person_id, kernel.approval_requests.route_company_id]
    paths:
      - apps/api/src/modules/approvals/route-world.ts
      - apps/api/src/modules/approvals/attention.ts
      - apps/api/src/modules/users/service.ts
      - apps/api/src/modules/users/away.ts
      - packages/shared/src/approvals/authority.ts
    visibleState: [usual]
    whoIsTold: [usual]
    copiedNameAt: []
    cells: { Rn: c, Mg: P, Dl: C, Dx: C, Pm: C, Ap: c, Mv: K, Rs: H, Dr: e, Ex: a, Mi: M, Rv: V, Aw: W }
    open:
      Mg: a request is routed to an import placeholder only through an import, which this file does not drive
      Rs: no route resolver reads a restricted document in this tree

  - name: routine-owner
    what: a routine to the person it acts for
    storedIn: kernel.routines.owner_user_id
    columns: [kernel.routines.owner_user_id]
    paths:
      - apps/api/src/modules/agent/routines/
      - apps/api/src/modules/users/service.ts
    visibleState: [paused_user, paused_scope_mismatch, paused_app_disabled]
    whoIsTold: [owner]
    copiedNameAt: []
    cells: { Rn: c, Mg: P, Dl: C, Dx: C, Pm: C, Ap: C, Mv: a, Rs: a, Dr: e, Ex: E, Mi: a, Rv: V, Aw: W }
    open:
      Mg: a person merge refuses while the placeholder owns a routine (merge-references.ts), so the expected class is refuse, not repoint
      Dl: what a routine shows once it is deleted is its absence; no reader is defined who must be told
      Ap: no code sets a routine to paused_app_disabled; what it shows once its app is switched off is not defined
      Ex: no data subject export exists for a person; the export takes a contact
      Aw: what a routine does while its owner is away is not defined

  - name: calendar-event-away-range
    what: a calendar event to the away range read from it
    storedIn: kernel.away_ranges.source_event_ref
    columns: [kernel.away_ranges.source_event_ref]
    paths:
      - apps/api/src/apps/calendar/away-from-calendar.ts
      - apps/api/src/modules/users/away.ts
    visibleState: [here, usual]
    whoIsTold: [usual]
    copiedNameAt: []
    cells: { Rn: K, Mg: a, Dl: C, Dx: C, Pm: a, Ap: C, Mv: C, Rs: a, Dr: e, Ex: E, Mi: M, Rv: V, Aw: a }
    open:
      Ex: no data subject export exists for a person; the export takes a contact
      Mi: no calendar range is older than away ranges themselves; nothing to migrate yet

  - name: away-range-person
    what: an away range to the person away
    storedIn: kernel.away_ranges.user_id
    columns: [kernel.away_ranges.user_id]
    paths:
      - apps/api/src/modules/users/away.ts
      - apps/api/src/modules/users/service.ts
      - apps/api/src/modules/approvals/route-world.ts
    visibleState: [usual, here]
    whoIsTold: [usual]
    copiedNameAt: []
    cells: { Rn: a, Mg: P, Dl: C, Dx: C, Pm: a, Ap: a, Mv: a, Rs: a, Dr: e, Ex: E, Mi: a, Rv: V, Aw: a }
    open:
      Mg: a person merge moves the placeholder's away record to the person (merge-references.ts, tested in merge-placeholder.test.ts); no placeholder is away in this world, so the cell's reader test waits for one
      Ex: no data subject export exists for a person; the export takes a contact
      Rv: a range is deleted when its person is deactivated, so after reactivation it cannot read as before; the way back is not defined

  - name: away-range-next-in-line
    what: an away range to the colleague who stands in
    storedIn: kernel.away_ranges.next_in_line_id, kernel.user_preferences.next_in_line_id
    columns: [kernel.away_ranges.next_in_line_id, kernel.user_preferences.next_in_line_id]
    paths:
      - apps/api/src/modules/users/away.ts
      - apps/api/src/modules/approvals/route-world.ts
      - apps/api/src/modules/approvals/attention.ts
    visibleState: [left, blocked]
    whoIsTold: [usual, person]
    copiedNameAt: []
    cells: { Rn: c, Mg: P, Dl: c, Dx: C, Pm: C, Ap: a, Mv: K, Rs: H, Dr: e, Ex: E, Mi: a, Rv: V, Aw: W }
    open:
      Mg: only an import placeholder merges, and a placeholder is never named next in line
      Mv: what moves for a next in line is not defined
      Rs: no stand-in row comes from a restricted document in this tree
      Ex: no data subject export exists for a person; the export takes a contact

  - name: stand-in-row-item
    what: the Home row of a stand-in to the item it stands in for
    storedIn: placement at read, from the approval and the away range
    columns: []
    paths:
      - apps/api/src/modules/approvals/attention.ts
      - apps/api/src/modules/approvals/route-world.ts
      - apps/api/src/modules/approvals/decide.ts
      - apps/api/src/modules/users/away.ts
    visibleState: [denied, approved, cancelled, left, blocked]
    whoIsTold: [usual, person]
    copiedNameAt: []
    cells: { Rn: a, Mg: P, Dl: C, Dx: C, Pm: C, Ap: C, Mv: K, Rs: H, Dr: e, Ex: a, Mi: a, Rv: V, Aw: W }
    open:
      Mg: only an import placeholder merges, and a placeholder never stands in
      Rs: no stand-in row comes from a restricted document in this tree

  - name: thread-created-from
    what: a conversation to the record it was made from
    storedIn: kernel.threads.created_from
    columns: [kernel.threads.created_from]
    paths:
      - apps/api/src/modules/threads/
      - apps/api/src/apps/tickets/merge.ts
      - apps/api/src/apps/projects/service/tasks.ts
    visibleState: [gone]
    whoIsTold: [owner]
    copiedNameAt: [owner, member]
    cells: { Rn: K, Mg: P, Dl: C, Dx: a, Pm: H, Ap: C, Mv: K, Rs: H, Dr: e, Ex: E, Mi: a, Rv: V, Aw: a }
    open:
      Dl: what a conversation shows once its record is deleted is not defined
      Rs: needs a knowledge document as the record
      Ex: no data subject export exists for a person; the export takes a contact

  - name: dashboard-owner
    what: a dashboard to the person whose it is
    storedIn: kernel.dashboards.owner_user_id
    columns: [kernel.dashboards.owner_user_id]
    paths:
      - apps/api/src/modules/dashboards/
      - apps/api/src/modules/users/service.ts
      - apps/api/src/modules/users/merge-references.ts
      - apps/api/src/modules/export/member-data-subject-bundle.ts
    visibleState: []
    whoIsTold: [owner, admin, colleague]
    copiedNameAt: []
    cells: { Rn: c, Mg: P, Dl: C, Dx: K, Pm: K, Ap: a, Mv: a, Rs: a, Dr: e, Ex: E, Mi: a, Rv: V, Aw: a }
    open:
      Mg: only an import placeholder merges, and a placeholder never owns a dashboard (dashboards are never imported); the merge moves the owner to the person (merge-references.ts)
      Dl: what an organization dashboard shows once its owner deleted their account is not defined; erasure deletes personal dashboards and leaves organization ones without an owner
    broken:
      Ex: the member data export (modules/export/member-data-subject-bundle.ts) has no dashboards section on this branch yet; main adds it

  - name: dashboard-author
    what: a dashboard to the people who made it and last changed it
    storedIn: kernel.dashboards.created_by, updated_by
    columns: [kernel.dashboards.created_by, kernel.dashboards.updated_by]
    paths:
      - apps/api/src/modules/dashboards/
      - apps/api/src/modules/users/service.ts
      - apps/api/src/modules/users/merge-references.ts
      - apps/api/src/modules/export/member-data-subject-bundle.ts
    visibleState: []
    whoIsTold: [owner, admin, colleague]
    copiedNameAt: []
    cells: { Rn: c, Mg: P, Dl: C, Dx: K, Pm: c, Ap: a, Mv: a, Rs: a, Dr: e, Ex: E, Mi: a, Rv: c, Aw: a }
    open:
      Mg: only an import placeholder merges, and a placeholder never makes a dashboard; the merge moves the author columns to the person (merge-references.ts)
      Dl: what a dashboard shows once the person who made it deleted their account is not defined; erasure clears the author columns
    broken:
      Ex: the member data export (modules/export/member-data-subject-bundle.ts) has no dashboards section on this branch yet; main adds it

  - name: store-document-author
    what: a data store document to the people who wrote it and last changed it
    storedIn: kernel.app_documents.created_by, updated_by
    columns: [kernel.app_documents.created_by, kernel.app_documents.updated_by]
    paths:
      - apps/api/src/modules/data-store/
      - apps/api/src/modules/users/service.ts
      - apps/api/src/modules/users/merge-references.ts
      - apps/api/src/modules/export/member-data-subject-bundle.ts
    visibleState: []
    whoIsTold: [owner, admin, colleague]
    copiedNameAt: []
    cells: { Rn: c, Mg: P, Dl: C, Dx: K, Pm: c, Ap: a, Mv: a, Rs: a, Dr: e, Ex: E, Mi: a, Rv: c, Aw: a }
    open:
      Mg: only an import placeholder merges, and a placeholder never writes a store document (they are never imported); the merge moves the author columns to the person (merge-references.ts)
      Dl: what a store document shows once the person who wrote it deleted their account is not defined; erasure clears the author columns
    broken:
      Ex: the member data export (modules/export/member-data-subject-bundle.ts) has no store documents section on this branch yet; main adds it

  - name: store-document-key
    what: a data store document to its own key, which the app that owns the collection chooses
    storedIn: kernel.app_documents.doc_id
    columns: [kernel.app_documents.doc_id]
    paths:
      - apps/api/src/modules/data-store/
    visibleState: []
    whoIsTold: []
    copiedNameAt: []
    cells: { Rn: a, Mg: a, Dl: a, Dx: a, Pm: a, Ap: a, Mv: a, Rs: a, Dr: e, Ex: a, Mi: a, Rv: a, Aw: a }
