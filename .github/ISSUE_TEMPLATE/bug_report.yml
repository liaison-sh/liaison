name: Bug report
description: Report a problem with Liaison
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not use this
        form for security vulnerabilities — see [SECURITY.md](../../SECURITY.md)
        instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Which Liaison version (release tag or commit) are you running?
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The steps that reliably trigger the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste any relevant log output. This will be rendered as code automatically.
      render: shell
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, deployment method (docker compose, dev server, ...), browser (if frontend-related).
    validations:
      required: false
