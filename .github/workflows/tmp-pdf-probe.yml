name: tmp-pdf-probe
on:
  push:
    branches: [fix/release-unit-tests]
    paths: [".github/workflows/tmp-pdf-probe.yml"]
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.x"
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client redis-tools libxml2-utils strace
      - run: |
          cp .env.test.example .env.test
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|; s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 32)|" .env.test
      - run: bun run infra:up
      - run: bun run scripts/bootstrap-test-env.ts
      - name: The whole file # with dumps off
        run: |
          bun run scripts/test-run.ts unit --file src/modules/documents/pdf-form.test.ts 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -vE '^\{"level"' | grep -E '✗|\(fail\)|^ *[0-9]+ (pass|fail)$|Expected|Received|unit exited' | cut -c1-170
