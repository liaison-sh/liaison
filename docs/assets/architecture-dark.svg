<svg xmlns="http://www.w3.org/2000/svg" width="880" height="468" viewBox="0 0 880 468" role="img" aria-labelledby="title desc"><title id="title">Liaison architecture</title><desc id="desc">Web, desktop, mobile and MCP clients talk over HTTPS and WebSocket to one app container. Inside it: the HTTP API (Hono), the kernel, and apps running in a QuickJS sandbox, plus the outbox and job workers. The app uses Postgres with row-level security, Redis, MeiliSearch and an S3-compatible object store.</desc><style>
text{font-family:Geist, 'Geist Sans', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;}
.t{font-size:15px;font-weight:600;fill:#cdcdd4;}
.s{font-size:13px;fill:#888892;}
.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:13px;fill:#cdcdd4;}
.ms{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:13px;fill:#888892;}
.g{font-size:13px;font-weight:600;fill:#888892;letter-spacing:.02em;}
.l{font-size:13px;fill:#888892;}
.le{font-size:13px;fill:#e86464;}
.n{font-size:13px;font-weight:600;fill:#16161a;}
.box{fill:#1a1a1e;stroke:#333340;stroke-width:1.25;}
.acc{fill:rgba(176,184,200,0.08);stroke:#b0b8c8;stroke-width:1.25;}
.err{fill:rgba(232,100,100,0.06);stroke:#e86464;stroke-width:1.25;}
.grp{fill:#111113;stroke:#262630;stroke-width:1.25;}
.dash{fill:none;stroke:#333340;stroke-width:1.25;stroke-dasharray:5 4;}
.ln{fill:none;stroke:#b0b8c8;stroke-width:1.5;}
.lm{fill:none;stroke:#65656e;stroke-width:1.5;stroke-dasharray:4 4;}
.lx{fill:none;stroke:#e86464;stroke-width:1.5;stroke-dasharray:4 4;}
.dot{fill:#b0b8c8;}
.ha{fill:#b0b8c8;}
.hm{fill:#65656e;}
.hx{fill:#e86464;}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path class="ha" d="M0,0.8 L10,5 L0,9.2 z"/></marker><marker id="am" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path class="hm" d="M0,0.8 L10,5 L0,9.2 z"/></marker><marker id="ax" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path class="hx" d="M0,0.8 L10,5 L0,9.2 z"/></marker></defs><rect x="24" y="20" width="196" height="60" rx="10" class="box"/><text x="122.0" y="46.0" class="t" text-anchor="middle">Web</text><text x="122.0" y="65.0" class="s" text-anchor="middle">SolidJS</text><path d="M122,80 L122,128" class="ln" marker-end="url(#a)"/><rect x="238" y="20" width="196" height="60" rx="10" class="box"/><text x="336.0" y="46.0" class="t" text-anchor="middle">Desktop</text><text x="336.0" y="65.0" class="s" text-anchor="middle">Tauri</text><path d="M336,80 L336,128" class="ln" marker-end="url(#a)"/><rect x="452" y="20" width="196" height="60" rx="10" class="box"/><text x="550.0" y="46.0" class="t" text-anchor="middle">Mobile</text><text x="550.0" y="65.0" class="s" text-anchor="middle">Capacitor</text><path d="M550,80 L550,128" class="ln" marker-end="url(#a)"/><rect x="666" y="20" width="196" height="60" rx="10" class="box"/><text x="764.0" y="46.0" class="t" text-anchor="middle">MCP clients</text><text x="764.0" y="65.0" class="s" text-anchor="middle">outside agents</text><path d="M764,80 L764,128" class="ln" marker-end="url(#a)"/><text x="443" y="109" class="l" text-anchor="middle">HTTPS · WebSocket · MCP</text><rect x="24" y="132" width="838" height="208" rx="14" class="grp"/><text x="42" y="158" class="g" text-anchor="start">app container</text><rect x="44" y="172" width="254" height="70" rx="10" class="acc"/><text x="171.0" y="194.0" class="t" text-anchor="middle">HTTP API</text><text x="171.0" y="213.0" class="s" text-anchor="middle">Hono: REST, WebSocket, MCP,</text><text x="171.0" y="231.0" class="s" text-anchor="middle">and the built web app</text><rect x="316" y="172" width="254" height="70" rx="10" class="acc"/><text x="443.0" y="194.0" class="t" text-anchor="middle">Kernel</text><text x="443.0" y="213.0" class="s" text-anchor="middle">auth, scopes, approvals,</text><text x="443.0" y="231.0" class="s" text-anchor="middle">events, agents</text><rect x="588" y="172" width="254" height="70" rx="10" class="acc"/><text x="715.0" y="194.0" class="t" text-anchor="middle">Apps</text><text x="715.0" y="213.0" class="s" text-anchor="middle">QuickJS sandbox, in process</text><text x="715.0" y="231.0" class="s" text-anchor="middle">or in a worker process</text><path d="M298,207 L316,207" class="ln" marker-end="url(#a)"/><path d="M588,207 L570,207" class="ln" marker-end="url(#a)"/><rect x="44" y="258" width="798" height="62" rx="10" class="box"/><text x="443.0" y="285.0" class="t" text-anchor="middle">Background workers</text><text x="443.0" y="304.0" class="s" text-anchor="middle">transactional outbox worker · BullMQ job workers</text><path d="M122,340 L122,384" class="ln" marker-end="url(#a)"/><rect x="24" y="388" width="196" height="60" rx="10" class="box"/><text x="122.0" y="414.0" class="t" text-anchor="middle">PostgreSQL</text><text x="122.0" y="433.0" class="s" text-anchor="middle">row-level security</text><path d="M336,340 L336,384" class="ln" marker-end="url(#a)"/><rect x="238" y="388" width="196" height="60" rx="10" class="box"/><text x="336.0" y="414.0" class="t" text-anchor="middle">Redis</text><text x="336.0" y="433.0" class="s" text-anchor="middle">cache, pub/sub, job queues</text><path d="M550,340 L550,384" class="ln" marker-end="url(#a)"/><rect x="452" y="388" width="196" height="60" rx="10" class="box"/><text x="550.0" y="414.0" class="t" text-anchor="middle">MeiliSearch</text><text x="550.0" y="433.0" class="s" text-anchor="middle">unified search</text><path d="M764,340 L764,384" class="ln" marker-end="url(#a)"/><rect x="666" y="388" width="196" height="60" rx="10" class="box"/><text x="764.0" y="414.0" class="t" text-anchor="middle">Object store</text><text x="764.0" y="433.0" class="s" text-anchor="middle">S3-compatible, SeaweedFS</text></svg>
